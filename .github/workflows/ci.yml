name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # make_report.py names the commit that last changed results/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: clang-format
        run: clang-format --dry-run --Werror include/hashbench/*.h tests/*.cpp tests/*.h bench/*.cpp bench/*.h
      - name: Report kit matches its pinned hashes
        run: python report-kit/check_kit.py
      - name: Committed report, card and README block are current
        run: |
          python scripts/make_report.py --results results --site site --command scripts/run_bench.sh --readme README.md
          git diff --exit-code -- site README.md
      - name: Report tests (numbers recomputed from results/)
        run: python -m unittest discover -s scripts -p "test_*.py"
      # Pages publishes site/ as committed: the report built from the committed
      # results (repeated runs on a named machine), never a CI-runner benchmark.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  build-test:
    name: ${{ matrix.name }} ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-gcc-14, os: ubuntu-24.04, cc: gcc-14, cxx: g++-14, preset: release }
          - { name: ubuntu-clang-18, os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, preset: release }
          - { name: ubuntu-clang-18, os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, preset: sanitize }
          - { name: macos-clang, os: macos-15, cc: clang, cxx: clang++, preset: release }
          - { name: macos-clang, os: macos-15, cc: clang, cxx: clang++, preset: sanitize }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cmake==4.4.4 ninja==1.13.2
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DHB_WERROR=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [format, build-test]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
