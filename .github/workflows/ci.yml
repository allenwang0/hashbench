name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: clang-format
        run: clang-format --dry-run --Werror include/hashbench/*.h tests/*.cpp tests/*.h bench/*.cpp bench/*.h
      - name: Report smoke tests
        run: python -m unittest discover -s scripts -p "test_*.py"

  build-test:
    name: ${{ matrix.name }} ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-gcc-14, os: ubuntu-24.04, cc: gcc-14, cxx: g++-14, preset: release }
          - { name: ubuntu-clang-18, os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, preset: release }
          - { name: ubuntu-clang-18, os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, preset: sanitize }
          - { name: macos-clang, os: macos-15, cc: clang, cxx: clang++, preset: release }
          - { name: macos-clang, os: macos-15, cc: clang, cxx: clang++, preset: sanitize }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cmake==4.4.4 ninja==1.13.2
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DHB_WERROR=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  pages-build:
    name: Build report
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild site/ from the committed results
        run: |
          sha=$(python3 -c 'import json; print(json.load(open("site/card.json"))["sha"])')
          python3 scripts/make_report.py --results results --site site --command scripts/run_bench.sh --sha "$sha"
          test -f site/kit/report.css && test -f site/kit/charts.js && test -f site/kit/report.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages-deploy:
    name: Deploy report to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pages-build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
